# Compose file consumed by the Elestio CI/CD pipeline (see elestio.yml).
# It must stay at the repository root: Elestio clones the repo, writes the
# generated .env next to it and runs `docker-compose up -d` from there.
# The generic self-hosting compose file lives in packages/twenty-docker/.

name: twenty

# The image tag is pinned here rather than read from SOFTWARE_VERSION_TAG: the
# Elestio pipeline materialises its environment variables once at creation and
# never re-reads elestio.yml, while it does resynchronise this file from the
# repo on every deploy. Pinning here keeps the repo the single source of truth.

services:
  server:
    image: twentycrm/twenty:v2.42.6
    volumes:
      - ./storage/server-local-data:/app/packages/twenty-server/.local-storage
    ports:
      - "172.17.0.1:3000:3000"
    env_file:
      - ./.env
    environment:
      NODE_PORT: 3000
      # Overrides the .env value, which the pipeline froze to the vm.elestio.app
      # hostname at creation. Every link the server generates uses this.
      SERVER_URL: https://crm.insightdialog.ai
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 5s
      timeout: 5s
      retries: 20
      # The first boot initialises the database and runs every migration before
      # the HTTP server listens, which outlasts interval x retries on a small VM.
      start_period: 600s
    restart: always

  worker:
    image: twentycrm/twenty:v2.42.6
    volumes:
      - ./storage/server-local-data:/app/packages/twenty-server/.local-storage
    command: ["yarn", "worker:prod"]
    env_file:
      - ./.env
    environment:
      SERVER_URL: https://crm.insightdialog.ai
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:-postgres}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISABLE_DB_MIGRATIONS: "true" # it already runs on the server
      DISABLE_CRON_JOBS_REGISTRATION: "true" # it already runs on the server
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16
    volumes:
      - ./storage/db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:-postgres}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis
    restart: always
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
